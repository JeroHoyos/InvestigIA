[project]
name = "investigia"
version = "0.1.0"
description = "Asistente de IA para investigación académica (LangGraph + Ollama + FastAPI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "langgraph>=0.2.55",
    "langchain-ollama>=0.1.3",
    "langchain-core>=0.2.0",
    "arxiv>=2.1.3",
    "scholarly>=1.7.11",
    "openpyxl>=3.1.2",
    "python-docx>=1.1.0",
    "pdfplumber>=0.10.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"
